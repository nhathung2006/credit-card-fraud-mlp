[paths]
# Relative paths are resolved from this TOML file's folder.
data_dir = "../dataset/playground-series-s6e11"
checkpoint = "artifacts/best-80-20.pt"
output = "artifacts/submission.csv"

[runtime]
device = "auto"
batch_size = 1024

[training]
epochs = 30
patience = 5
lr = 0.001
seed = 42
validation_fraction = 0.2
test_fraction = 0.0

[model]
embedding_dim = 4
hidden_sizes = [256, 128, 64]
dropout = 0.2
